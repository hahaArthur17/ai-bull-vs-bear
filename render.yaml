services:
  - type: web
    name: ai-bull-vs-bear-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    buildFilter:
      paths:
        - Dockerfile
        - .dockerignore
        - backend/app/**
        - backend/requirements-runtime.txt
        - data/catalog/**
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: PERSISTENCE_MODE
        value: supabase
      - key: ANALYSIS_PROVIDER
        value: demo
      - key: DEBATE_WORKFLOW_V2
        value: "false"
      - key: DEBATE_QUEUE_ENABLED
        value: "false"
      - key: DEBATE_STREAMING_PROVIDER
        value: deterministic
      - key: REDIS_ENABLED
        value: "false"
      - key: DEBATE_RATE_LIMIT_PER_WINDOW
        value: "3"
      - key: DEBATE_RATE_LIMIT_WINDOW_SECONDS
        value: "3600"
      - key: DEBATE_ACTIVE_TTL_SECONDS
        value: "1200"
      - key: EXPLANATION_RATE_LIMIT_PER_WINDOW
        value: "12"
      - key: EXPLANATION_RATE_LIMIT_WINDOW_SECONDS
        value: "3600"
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  - type: web
    name: ai-bull-vs-bear
    runtime: static
    rootDir: apps/mobile
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - apps/mobile/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://ai-bull-vs-bear-api.onrender.com
      - key: EXPO_PUBLIC_API_TIMEOUT_MS
        value: 75000
      - key: EXPO_PUBLIC_AUTH_MODE
        value: supabase
      - key: EXPO_PUBLIC_DEBATE_V2_ENABLED
        value: "false"
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
