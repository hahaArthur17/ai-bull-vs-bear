name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python code quality
        run: |
          ruff check app tests ../scripts
          ruff format --check app tests ../scripts
          bandit -r app -ll -q
      - name: Run tests
        run: pytest -q --junitxml=test-results.xml
      - name: Preserve regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  database-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Verify database permissions and interruption transactions
        run: |
          python scripts/validate_database_security.py
          sh scripts/validate_debate_interruption_sql.sh

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated UI integration API
        run: python -m pip install -r ../../backend/requirements-runtime.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify mobile app
        run: |
          npm run format:check
          npm run test:stream
          npm run test:integration
          node --test ../../scripts/review-scenario-proxy.test.mjs
          npm run typecheck
          npm run build:web
      - name: Preserve component and full-flow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: apps/mobile/test-results/ui.xml
      - name: Report dependency vulnerabilities
        continue-on-error: true
        run: npm audit --omit=dev --json > npm-audit.json
      - name: Preserve dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dependency-audit
          path: apps/mobile/npm-audit.json
