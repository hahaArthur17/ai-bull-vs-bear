name: Refresh AAPL weekly history

on:
  schedule:
    # Saturday 02:00 UTC is after the Friday regular US market close.
    - cron: "0 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      WEEKLY_PRICE_HISTORY_POINTS: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt
      - run: pip install -r backend/requirements-runtime.txt
      - run: PYTHONPATH=backend python scripts/ingest_aapl_weekly_history.py
