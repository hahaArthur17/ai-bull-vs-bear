name: Web portfolio

on:
  push:
    branches: [main, codex/web-portfolio]
    paths: ["apps/web/**", ".github/workflows/web.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Check source quality
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test
      - name: Build the public demo
        run: npm run build
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify the user journeys
        run: npm run test:e2e
      - name: Preserve browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
