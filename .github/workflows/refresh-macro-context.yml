name: Refresh macro market context

on:
  schedule:
    # One post-close cache refresh; this does not consume Alpha Vantage calls.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MACRO_HISTORY_POINTS: "400"
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt
      - run: pip install -r backend/requirements-runtime.txt
      - run: PYTHONPATH=backend python scripts/ingest_macro_context.py
