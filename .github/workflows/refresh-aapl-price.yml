name: Refresh AAPL daily price

on:
  schedule:
    # 23:00 UTC is after the regular US market close in both EST and EDT.
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      PRICE_TICKERS: AAPL
      PRICE_MAX_CALLS_PER_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt
      - run: pip install -r backend/requirements-runtime.txt
      - run: PYTHONPATH=backend python scripts/ingest_live_prices.py
